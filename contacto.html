
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | AhorraTech</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">

    <!-- CSS propio después de Bootstrap -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="container py-3">

    <header class="encabezado">
        <h1>Contáctanos</h1>
        <p>Estamos aquí para ayudarte a elegir tecnología eficiente.</p>

        <nav class="menu" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section aria-labelledby="titulo-contacto">
            <h2 id="titulo-contacto">Envíanos tu consulta</h2>

            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-7">

                    <div class="tarjeta">
                        <form id="formulario-contacto">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" id="nombre" name="nombre"
                                       class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" id="correo" name="correo"
                                       class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" id="telefono" name="telefono"
                                       class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría de interés</label>
                                <select id="categoria" name="categoria"
                                        class="form-select" required>
                                    <option value="">Selecciona una categoría</option>
                                    <option value="iluminacion">Iluminación</option>
                                    <option value="electrodomesticos">Electrodomésticos</option>
                                    <option value="solar">Energía solar</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="asunto" class="form-label">Asunto</label>
                                <input type="text" id="asunto" name="asunto"
                                    class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="mensaje" class="form-label">Mensaje</label>
                                <textarea id="mensaje" name="mensaje"
                                        class="form-control" rows="4"
                                        required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Enviar consulta
                            </button>

                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="pie">
        <p>AhorraTech - Tecnología inteligente, ahorro real.</p>
        <p>Ingeniería Web I - IU Digital de Antioquia - 2026-2</p>
    </footer>

    <script>
        // Demostración local: no se envían datos a un servidor.
        document.querySelector("#formulario-contacto")
            .addEventListener("submit", function (evento) {
                evento.preventDefault();
                alert("Formulario de demostración. No se han enviado datos.");
            });
    </script>

</body>
</html>
